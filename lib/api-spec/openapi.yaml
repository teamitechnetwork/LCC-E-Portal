openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session operations
  - name: portal
    description: Portal dashboard and academic operations
  - name: documents
    description: Official document access and verification
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to the portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [portal]
      summary: Get the dashboard for the current role
      responses:
        "200":
          description: Role-aware dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /courses:
    get:
      operationId: listCourses
      tags: [portal]
      summary: List visible courses
      parameters:
        - name: semester
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /courses/{courseId}/register:
    post:
      operationId: registerCourse
      tags: [portal]
      summary: Register the current student for a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /results:
    get:
      operationId: listResults
      tags: [portal]
      summary: List academic results
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Result"
  /finance:
    get:
      operationId: getFinance
      tags: [portal]
      summary: Get the current student's fee summary
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List official documents for the current user
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [portal]
      summary: List current announcements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
  /support-tickets:
    post:
      operationId: createSupportTicket
      tags: [portal]
      summary: Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Created support ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
  /verify/{verificationNumber}:
    get:
      operationId: verifyDocument
      tags: [documents]
      summary: Verify an official document
      parameters:
        - name: verificationNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResult"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Role:
      type: string
      enum: [student, staff, admin, super_admin]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        identifier: { type: string }
        avatarInitials: { type: string }
      required: [id, name, email, role, identifier, avatarInitials]
    LoginInput:
      type: object
      properties:
        email:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 1
        rememberMe:
          type: boolean
      required: [email, password]
    AuthSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        expiresAt: { type: string }
      required: [user, expiresAt]
    Metric:
      type: object
      properties:
        label: { type: string }
        value: { type: string }
        detail: { type: string }
        tone:
          type: string
          enum: [navy, blue, gold, green, orange, purple]
      required: [label, value, detail, tone]
    UpcomingItem:
      type: object
      properties:
        title: { type: string }
        subtitle: { type: string }
        time: { type: string }
        type:
          type: string
          enum: [class, assignment, event, deadline]
      required: [title, subtitle, time, type]
    ActivityItem:
      type: object
      properties:
        title: { type: string }
        detail: { type: string }
        timestamp: { type: string }
        kind:
          type: string
          enum: [grade, payment, registration, announcement, system]
      required: [title, detail, timestamp, kind]
    Dashboard:
      type: object
      properties:
        greeting: { type: string }
        currentSemester: { type: string }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
        upcoming:
          type: array
          items: { $ref: "#/components/schemas/UpcomingItem" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        progress:
          type: number
        role: { $ref: "#/components/schemas/Role" }
      required: [greeting, currentSemester, metrics, upcoming, activity, progress, role]
    Course:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        credits: { type: integer }
        instructor: { type: string }
        schedule: { type: string }
        room: { type: string }
        status:
          type: string
          enum: [registered, available, completed]
        accent:
          type: string
          enum: [blue, gold, purple, green]
      required: [id, code, title, credits, instructor, schedule, room, status, accent]
    Result:
      type: object
      properties:
        id: { type: string }
        courseCode: { type: string }
        courseTitle: { type: string }
        credits: { type: integer }
        score: { type: number }
        grade: { type: string }
        points: { type: number }
        semester: { type: string }
      required: [id, courseCode, courseTitle, credits, score, grade, points, semester]
    Payment:
      type: object
      properties:
        id: { type: string }
        date: { type: string }
        reference: { type: string }
        description: { type: string }
        amount: { type: number }
        status:
          type: string
          enum: [posted, pending, reversed]
      required: [id, date, reference, description, amount, status]
    FinanceSummary:
      type: object
      properties:
        totalFees: { type: number }
        amountPaid: { type: number }
        outstanding: { type: number }
        dueDate: { type: string }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
      required: [totalFees, amountPaid, outstanding, dueDate, payments]
    Document:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        type:
          type: string
          enum: [registration_slip, grade_report, enrollment_letter, transcript, certificate, student_id, receipt]
        issueDate: { type: string }
        verificationNumber: { type: string }
        status:
          type: string
          enum: [available, processing]
      required: [id, title, type, issueDate, verificationNumber, status]
    Announcement:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        date: { type: string }
        category:
          type: string
          enum: [academic, finance, event, urgent]
        read: { type: boolean }
      required: [id, title, body, date, category, read]
    SupportTicketInput:
      type: object
      properties:
        subject: { type: string, minLength: 3 }
        message: { type: string, minLength: 5 }
        category:
          type: string
          enum: [academics, finance, account, technical, other]
      required: [subject, message, category]
    SupportTicket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        category: { type: string }
        status:
          type: string
          enum: [open, in_progress, resolved]
        createdAt: { type: string }
      required: [id, subject, category, status, createdAt]
    VerificationResult:
      type: object
      properties:
        valid: { type: boolean }
        documentType: { type: string }
        issuedDate: { type: string }
        institution: { type: string }
        verificationNumber: { type: string }
        holderName: { type: ["string", "null"] }
      required: [valid, documentType, issuedDate, institution, verificationNumber, holderName]

