kind = "web"
previewPath = "/"
title = "LCC E-Portal"
description = "A mobile-first academic portal for Liberia Christian College, giving students, staff, administrators, and super administrators a secure place to manage academics, attendance, fees, documents, announcements, and institutional operations."
version = "1.0.0"
id = "artifacts/lcc-e-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20682

[services.development]
run = "pnpm --filter @workspace/lcc-e-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lcc-e-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/lcc-e-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20682"
BASE_PATH = "/"
